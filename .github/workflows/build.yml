name: Build packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── Debian package ────────────────────────────────────────────────
  build-deb:
    name: Debian package (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        run: echo "APP_VERSION=$(python3 packaging/scripts/get_version.py)" >> "$GITHUB_ENV"

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-wheel python3-build \
            python3-installer lintian

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect package files
        run: |
          mkdir -p artifacts
          mv ../ksnip-pyqt6_*.deb ../ksnip-pyqt6_*.buildinfo ../ksnip-pyqt6_*.changes artifacts/

      - name: Lint the package
        run: lintian --fail-on error artifacts/ksnip-pyqt6_*.deb

      - name: Inspect the package
        run: |
          dpkg-deb --info artifacts/ksnip-pyqt6_*.deb
          dpkg-deb --contents artifacts/ksnip-pyqt6_*.deb
          dpkg-deb --fsys-tarfile artifacts/ksnip-pyqt6_*.deb \
            | tar -tf - | grep -q "usr/bin/ksnip-pyqt6$"

      - name: Install and smoke-test the package
        run: |
          sudo apt-get install -y ./artifacts/ksnip-pyqt6_*.deb
          QT_QPA_PLATFORM=offscreen ksnip-pyqt6 --version
          QT_QPA_PLATFORM=offscreen python3 -c \
            "import ksnip_py.app, ksnip_py.canvas, ksnip_py.main_window; print('modules import correctly')"

      - name: Upload the Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian
          path: artifacts/*
          if-no-files-found: error

  # ─── AppImage ──────────────────────────────────────────────────────
  build-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve version
        run: echo "APP_VERSION=$(python3 packaging/scripts/get_version.py)" >> "$GITHUB_ENV"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 libfreetype6 \
            librsvg2-bin squashfs-tools patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          python -m pip install -r requirements.txt

      - name: Build the AppImage
        run: VERSION="$APP_VERSION" bash packaging/scripts/build-appimage.sh

      - name: Smoke-test the AppImage
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          file "$APPIMAGE"
          QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --version

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # ─── macOS portable ────────────────────────────────────────────────
  build-macos:
    name: macOS portable (.app in .zip)
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Resolve version
        run: echo "APP_VERSION=$(python3 packaging/scripts/get_version.py)" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          python -m pip install -r requirements.txt

      - name: Build the application bundle
        run: VERSION="$APP_VERSION" bash packaging/scripts/build-macos-app.sh

      - name: Inspect the archive
        run: |
          unzip -l dist/*.zip | head -20
          shasum -a 256 dist/*.zip

      - name: Upload the macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  # ─── Windows portable (Nuitka) ─────────────────────────────────────
  build-windows-portable:
    name: Windows portable (Nuitka)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (python packaging/scripts/get_version.py).Trim()
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Pin the same compiler as the clean Lucio IVA Calculator build.  Nuitka 2.x
          # attaches the constants blob to the Windows executable as a 6 MB RCDATA
          # resource; Nuitka 4.x with MSVC links it into .rdata instead.  The RCDATA
          # form is a large opaque blob in a PE resource and is a known ML-heuristic
          # trigger.  Do not loosen this pin without re-running the Defender scan step.
          python -m pip install "nuitka==4.1.3" ordered-set zstandard

      - name: Build the portable ZIP
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/scripts/build-windows-portable.ps1 -Version $env:APP_VERSION

      - name: Inspect the archive
        shell: pwsh
        run: |
          Get-ChildItem build -Filter "*.zip" | Format-Table Name, Length
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('build/*.zip')[0]); names=z.namelist(); print(len(names), 'entries'); assert any(n.endswith('/ksnip-pyqt6.exe') for n in names); assert not any(chr(92) in n for n in names)"

      # VirusTotal scanning the installer or the ZIP does not scan the executable
      # inside it.  That is how a clean installer can still deliver an executable
      # that Windows Defender removes as Trojan:Win32/Wacatac.C!ml.  Scan the
      # executable itself, and do not remediate it so the artifact survives for
      # the rest of the job.
      - name: Scan the packaged executable with Microsoft Defender
        shell: pwsh
        run: |
          $zip = Get-ChildItem "build" -Filter "*.zip" | Select-Object -First 1
          $scanDir = Join-Path $env:RUNNER_TEMP "ksnip-defender-scan"
          Remove-Item $scanDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $scanDir -Force
          $exe = Get-ChildItem $scanDir -Recurse -Filter "ksnip-pyqt6.exe" | Select-Object -First 1
          if (-not $exe) { throw "the packaged executable was not found for the Defender scan" }
          & packaging/scripts/scan-windows-defender.ps1 -Path $exe.FullName -AllowMissing

      - name: Upload the Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/*.zip
          if-no-files-found: error

  # ─── Windows installer (NSIS) ──────────────────────────────────────
  build-windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-2025
    timeout-minutes: 30
    needs: build-windows-portable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: build

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (python packaging/scripts/get_version.py).Trim()
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install NSIS
        run: choco install nsis --version=3.12.0 -y --no-progress

      - name: Show the NSIS version
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis.exe).Source }
          & $makensis /VERSION

      - name: Stage the installer payload
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "build\installer"
          $extract = Join-Path $PWD "build\extracted"
          New-Item -ItemType Directory -Force -Path $stage, $extract | Out-Null
          $zip = Get-ChildItem "build" -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $payload = Get-ChildItem $extract -Directory | Select-Object -First 1
          $target = Join-Path $stage "ksnip-pyqt6"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $payload.FullName "*") $target -Recurse -Force
          Copy-Item "LICENSE.txt" (Join-Path $stage "LICENSE") -Force
          Copy-Item "packaging\windows\ksnip.ico" (Join-Path $stage "ksnip.ico") -Force
          Copy-Item "packaging\windows\nsis-header.bmp" (Join-Path $stage "nsis-header.bmp") -Force
          Copy-Item "packaging\windows\nsis-welcome.bmp" (Join-Path $stage "nsis-welcome.bmp") -Force
          Copy-Item "packaging\windows\ksnip.nsi" (Join-Path $stage "ksnip.nsi") -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $parts = $env:APP_VERSION.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $windowsVersion = ($parts[0..3] -join ".")
          $name = "ksnip-pyqt6-$($env:APP_VERSION)-Windows-x64-setup.exe"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = (Get-Command makensis.exe).Source }
          Push-Location "build\installer"
          try {
            & $makensis "/DVERSION=$windowsVersion" "/DINSTALLER_NAME=$name" "ksnip.nsi"
            if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Move-Item "build\installer\$name" "build\$name" -Force

      - name: Install and smoke-test the installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem "build" -Filter "*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $installed = Join-Path $env:LOCALAPPDATA "Programs\ksnip-pyqt6\ksnip-pyqt6.exe"
          if (-not (Test-Path $installed)) { throw "the installer did not create $installed" }
          $process = Start-Process -FilePath $installed -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installed executable exited with $($process.ExitCode)" }
          # --version exits before QApplication. This starts Qt, loads the icon and
          # translations, and constructs the main window on the installed payload.
          $env:QT_QPA_PLATFORM = "offscreen"
          $smoke = Start-Process -FilePath $installed -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "the installed executable failed --smoke-test with $($smoke.ExitCode)" }
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          & packaging/scripts/scan-windows-defender.ps1 -Path $installed, $setup.FullName -AllowMissing
          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\ksnip-pyqt6\uninstall.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/*-setup.exe
          if-no-files-found: error

