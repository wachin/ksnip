name: Linux - ksnip_py

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test ksnip_py on Linux
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxcb-cursor0 libxfixes3 hunspell hunspell-en-us

      - name: Install ksnip_py and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest

      - name: Verify the Python sources compile
        run: python -m compileall -q ksnip_py

      - name: Run the ksnip_py test suite
        run: python -m pytest tests_py -q

      - name: Verify the command-line entry point
        run: python -m ksnip_py --help

  package-python:
    name: Build ksnip_py Python distribution
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Python build frontend
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution from pyproject.toml
        run: python -m build

      - name: Upload ksnip_py distributions
        uses: actions/upload-artifact@v4
        with:
          name: ksnip-pyqt6-python-distributions
          path: dist/*
          if-no-files-found: error
