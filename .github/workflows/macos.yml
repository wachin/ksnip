name: macOS - ksnip_py

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-macos:
    name: Test ksnip_py on macOS
    runs-on: macos-14
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ksnip_py and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest

      - name: Verify the Python sources compile
        run: python -m compileall -q ksnip_py

      - name: Run the ksnip_py test suite
        run: python -m pytest tests_py -q

      - name: Verify the command-line entry point
        run: python -m ksnip_py --help

  package-python:
    name: Validate the ksnip_py wheel on macOS
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test-macos
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the Python build frontend
        run: python -m pip install --upgrade build

      - name: Build the wheel from pyproject.toml
        run: python -m build --wheel

      - name: Upload the wheel validated on macOS
        uses: actions/upload-artifact@v4
        with:
          name: ksnip-pyqt6-wheel-macos
          path: dist/*.whl
          if-no-files-found: error
